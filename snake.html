<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  .game-container {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 480px;
    padding: 0 4px;
  }
  .title {
    font-size: 28px;
    font-weight: 800;
    color: #e94560;
    text-shadow: 0 0 20px rgba(233,69,96,0.4);
    letter-spacing: 4px;
  }
  .score-board {
    display: flex;
    gap: 20px;
  }
  .score-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #eee;
  }
  .score-item span:first-child {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #888;
    margin-bottom: 2px;
  }
  .score-item span:last-child {
    font-size: 22px;
    font-weight: 700;
    color: #16c79a;
  }
  #best-score span:last-child { color: #f5a623; }

  canvas {
    border-radius: 12px;
    box-shadow:
      0 0 0 2px rgba(233,69,96,0.3),
      0 0 40px rgba(233,69,96,0.15),
      0 20px 60px rgba(0,0,0,0.5);
  }

  .controls {
    display: flex;
    gap: 12px;
    margin-top: 4px;
  }
  .btn {
    padding: 10px 28px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #e94560, #c23152);
    color: #fff;
    box-shadow: 0 4px 15px rgba(233,69,96,0.4);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(233,69,96,0.6); }
  .btn-secondary {
    background: rgba(255,255,255,0.08);
    color: #aaa;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.14); color: #ddd; }

  /* Mobile D-pad */
  .dpad {
    display: none;
    margin-top: 8px;
    position: relative;
    width: 160px;
    height: 160px;
  }
  .dpad-btn {
    position: absolute;
    width: 52px;
    height: 52px;
    border: none;
    border-radius: 12px;
    background: rgba(233,69,96,0.2);
    color: #e94560;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .dpad-btn:active { background: rgba(233,69,96,0.5); }
  .dpad-up    { top: 0; left: 50%; transform: translateX(-50%); }
  .dpad-down  { bottom: 0; left: 50%; transform: translateX(-50%); }
  .dpad-left  { top: 50%; left: 0; transform: translateY(-50%); }
  .dpad-right { top: 50%; right: 0; transform: translateY(-50%); }

  .hint {
    color: #555;
    font-size: 13px;
    letter-spacing: 1px;
  }

  @media (max-width: 520px) {
    canvas { border-radius: 8px; }
    .dpad { display: block; }
    .hint { display: none; }
    .title { font-size: 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0s !important; transition-duration: 0s !important; }
  }
</style>
</head>
<body>

<div class="game-container">
  <div class="header">
    <div class="title">SNAKE</div>
    <div class="score-board">
      <div class="score-item" id="cur-score">
        <span>Score</span>
        <span id="score">0</span>
      </div>
      <div class="score-item" id="best-score">
        <span>Best</span>
        <span id="best">0</span>
      </div>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <div class="controls">
    <button class="btn btn-primary" id="startBtn">开始游戏</button>
    <button class="btn btn-secondary" id="pauseBtn" style="display:none">暂停</button>
  </div>

  <div class="hint">方向键 / WASD 控制移动 · 空格键暂停</div>

  <div class="dpad">
    <button class="dpad-btn dpad-up" data-dir="up">▲</button>
    <button class="dpad-btn dpad-down" data-dir="down">▼</button>
    <button class="dpad-btn dpad-left" data-dir="left">◀</button>
    <button class="dpad-btn dpad-right" data-dir="right">▶</button>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const startBtn = document.getElementById('startBtn');
const pauseBtn = document.getElementById('pauseBtn');

// --- Config ---
const CELL = 20;
const COLS = 24;
const ROWS = 24;
canvas.width = COLS * CELL;
canvas.height = ROWS * CELL;

// --- Colors ---
const BG = '#16213e';
const GRID_COLOR = 'rgba(255,255,255,0.03)';
const SNAKE_HEAD = '#e94560';
const SNAKE_BODY = '#16c79a';
const SNAKE_BODY_ALT = '#0f9b7a';
const FOOD_COLOR = '#f5a623';
const FOOD_GLOW = 'rgba(245,166,35,0.3)';
const PARTICLE_COLORS = ['#e94560','#16c79a','#f5a623','#533483','#fff'];

// --- State ---
let snake, dir, nextDir, food, score, bestScore, gameLoop, paused, particles, speed, gameOver, started;

bestScore = parseInt(localStorage.getItem('snake_best') || '0');
bestEl.textContent = bestScore;

function init() {
  const mid = Math.floor(ROWS / 2);
  snake = [
    { x: 5, y: mid },
    { x: 4, y: mid },
    { x: 3, y: mid }
  ];
  dir = { x: 1, y: 0 };
  nextDir = { x: 1, y: 0 };
  score = 0;
  speed = 120;
  paused = false;
  gameOver = false;
  started = true;
  particles = [];
  scoreEl.textContent = '0';
  spawnFood();
}

function spawnFood() {
  let pos;
  do {
    pos = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
  } while (snake.some(s => s.x === pos.x && s.y === pos.y));
  food = pos;
  food.pulse = 0;
}

// --- Particles ---
function emitParticles(x, y) {
  for (let i = 0; i < 12; i++) {
    const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.5;
    const sp = 1.5 + Math.random() * 3;
    particles.push({
      x: x * CELL + CELL / 2,
      y: y * CELL + CELL / 2,
      vx: Math.cos(angle) * sp,
      vy: Math.sin(angle) * sp,
      life: 1,
      decay: 0.02 + Math.random() * 0.03,
      size: 2 + Math.random() * 3,
      color: PARTICLE_COLORS[Math.floor(Math.random() * PARTICLE_COLORS.length)]
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.97;
    p.vy *= 0.97;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// --- Drawing ---
function draw() {
  // Background
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid
  ctx.strokeStyle = GRID_COLOR;
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath();
    ctx.moveTo(x * CELL, 0);
    ctx.lineTo(x * CELL, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * CELL);
    ctx.lineTo(canvas.width, y * CELL);
    ctx.stroke();
  }

  // Food glow
  food.pulse = (food.pulse || 0) + 0.08;
  const glowSize = 14 + Math.sin(food.pulse) * 4;
  const grad = ctx.createRadialGradient(
    food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, 0,
    food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, glowSize
  );
  grad.addColorStop(0, FOOD_GLOW);
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, glowSize, 0, Math.PI * 2);
  ctx.fill();

  // Food
  ctx.fillStyle = FOOD_COLOR;
  const fSize = 7 + Math.sin(food.pulse) * 1.5;
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, fSize, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath();
  ctx.arc(food.x * CELL + CELL / 2 - 2, food.y * CELL + CELL / 2 - 2, 2.5, 0, Math.PI * 2);
  ctx.fill();

  // Snake body
  for (let i = snake.length - 1; i >= 1; i--) {
    const s = snake[i];
    const t = i / snake.length;
    const r = CELL / 2 - 1.5;
    const color = i % 2 === 0 ? SNAKE_BODY : SNAKE_BODY_ALT;
    ctx.fillStyle = color;
    ctx.globalAlpha = 0.5 + 0.5 * (1 - t);

    const cx = s.x * CELL + CELL / 2;
    const cy = s.y * CELL + CELL / 2;
    ctx.beginPath();
    ctx.roundRect(cx - r, cy - r, r * 2, r * 2, 5);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Snake head
  const head = snake[0];
  ctx.fillStyle = SNAKE_HEAD;
  ctx.shadowColor = SNAKE_HEAD;
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.roundRect(head.x * CELL + 1, head.y * CELL + 1, CELL - 2, CELL - 2, 6);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Eyes
  const ex = head.x * CELL + CELL / 2 + dir.x * 4;
  const ey = head.y * CELL + CELL / 2 + dir.y * 4;
  const perpX = -dir.y;
  const perpY = dir.x;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(ex + perpX * 3.5, ey + perpY * 3.5, 2.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(ex - perpX * 3.5, ey - perpY * 3.5, 2.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath();
  ctx.arc(ex + perpX * 3.5 + dir.x, ey + perpY * 3.5 + dir.y, 1.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(ex - perpX * 3.5 + dir.x, ey - perpY * 3.5 + dir.y, 1.4, 0, Math.PI * 2);
  ctx.fill();

  // Particles
  drawParticles();

  // Overlays
  if (!started) {
    drawOverlay('准备就绪', '按「开始游戏」或回车开始');
  } else if (gameOver) {
    drawOverlay('游戏结束', `最终得分: ${score}  ·  按回车重新开始`);
  } else if (paused) {
    drawOverlay('已暂停', '按空格继续');
  }
}

function drawOverlay(title, sub) {
  ctx.fillStyle = 'rgba(26,26,46,0.75)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#e94560';
  ctx.font = 'bold 32px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 16);

  ctx.fillStyle = '#888';
  ctx.font = '14px "Segoe UI", sans-serif';
  ctx.fillText(sub, canvas.width / 2, canvas.height / 2 + 20);
}

// --- Game Logic ---
function update() {
  if (paused || gameOver || !started) return;

  dir = { ...nextDir };
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // Wall collision
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    endGame(); return;
  }
  // Self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    endGame(); return;
  }

  snake.unshift(head);

  // Eat food
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    emitParticles(food.x, food.y);
    spawnFood();
    // Speed up
    if (speed > 60) {
      speed -= 2;
      clearInterval(gameLoop);
      gameLoop = setInterval(tick, speed);
    }
  } else {
    snake.pop();
  }

  updateParticles();
}

function tick() {
  update();
  draw();
}

function endGame() {
  gameOver = true;
  if (score > bestScore) {
    bestScore = score;
    bestEl.textContent = bestScore;
    localStorage.setItem('snake_best', bestScore);
  }
  startBtn.textContent = '重新开始';
  startBtn.style.display = '';
  pauseBtn.style.display = 'none';
  draw();
}

function startGame() {
  if (gameLoop) clearInterval(gameLoop);
  init();
  startBtn.style.display = 'none';
  pauseBtn.style.display = '';
  pauseBtn.textContent = '暂停';
  gameLoop = setInterval(tick, speed);
}

function togglePause() {
  if (gameOver || !started) return;
  paused = !paused;
  pauseBtn.textContent = paused ? '继续' : '暂停';
  if (!paused) draw();
  else draw();
}

// --- Input ---
document.addEventListener('keydown', e => {
  const key = e.key;

  if ((key === 'Enter' || key === ' ') && (!started || gameOver)) {
    e.preventDefault();
    startGame();
    return;
  }
  if (key === ' ' || key === 'Escape') {
    e.preventDefault();
    togglePause();
    return;
  }

  const map = {
    ArrowUp:    { x:  0, y: -1 }, w: { x:  0, y: -1 }, W: { x:  0, y: -1 },
    ArrowDown:  { x:  0, y:  1 }, s: { x:  0, y:  1 }, S: { x:  0, y:  1 },
    ArrowLeft:  { x: -1, y:  0 }, a: { x: -1, y:  0 }, A: { x: -1, y:  0 },
    ArrowRight: { x:  1, y:  0 }, d: { x:  1, y:  0 }, D: { x:  1, y:  0 },
  };
  const nd = map[key];
  if (nd && !(nd.x === -dir.x && nd.y === -dir.y)) {
    nextDir = nd;
  }
});

// D-pad (mobile)
document.querySelectorAll('.dpad-btn').forEach(btn => {
  const handler = () => {
    if (!started || gameOver) { startGame(); return; }
    const d = btn.dataset.dir;
    const map = { up: {x:0,y:-1}, down: {x:0,y:1}, left: {x:-1,y:0}, right: {x:1,y:0} };
    const nd = map[d];
    if (nd && !(nd.x === -dir.x && nd.y === -dir.y)) nextDir = nd;
  };
  btn.addEventListener('touchstart', e => { e.preventDefault(); handler(); });
  btn.addEventListener('click', handler);
});

// Swipe support
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});
canvas.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const absDx = Math.abs(dx), absDy = Math.abs(dy);
  if (Math.max(absDx, absDy) < 20) return;
  let nd;
  if (absDx > absDy) nd = dx > 0 ? {x:1,y:0} : {x:-1,y:0};
  else nd = dy > 0 ? {x:0,y:1} : {x:0,y:-1};
  if (!(nd.x === -dir.x && nd.y === -dir.y)) nextDir = nd;
});

startBtn.addEventListener('click', startGame);
pauseBtn.addEventListener('click', togglePause);

// Initial draw
draw();
</script>
</body>
</html>
